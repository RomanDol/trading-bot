<!DOCTYPE html>
<html>
<head>
    <title>Trading Bot Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Favicon и иконки для разных устройств -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23111'/><text x='50' y='65' font-size='60' text-anchor='middle' fill='%2300ff88'>🚀</text></svg>">
    <meta name="theme-color" content="#111111">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Trading Bot">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #111;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 50px;
        }
        @media (max-width: 768px) {
            body {
                padding: 20px;
            }
        }

        .header {
            text-align: center;
            background: linear-gradient(145deg, #1a1a1a, #2a2a2a);
            border-radius: 8px;
            padding: 8px 20px 1px;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            max-width: 1000px;
            margin: 0 auto 30px;
        }
        
        .header h1 {
            font-size: 1.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #5c6667, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .dashboard-controls {
            text-align: center;
            max-width: 1000px;
            margin: 30px auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-item {
            font-size: 13.33px;
            white-space: nowrap;
            display: inline-block;
            background: linear-gradient(145deg, #1a1a1a, #2a2a2a);
            border: 2px solid transparent;
            color: white;
            padding: 12px 20px;
            margin: 5px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        
        .btn-item:hover:not(.disabled) {
            border-color: #00ff88;
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.2);
        }
        
        .btn-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-item.disabled:hover {
            border-color: transparent;
            box-shadow: none;
        }
        
        .coming-soon {
            display: inline-block;
            background: #ff6b6b;
            color: white;
            font-size: 0.6em;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 500;
            margin-left: 8px;
            vertical-align: middle;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.1em;
            }
            
            .dashboard-controls {
                flex-direction: column;
                align-items: center;
            }
            
            .btn-item {
                width: 100%;
                max-width: 300px;
                margin: 3px 0;
            }
            

        }
        
        @media (max-width: 480px) {
            .btn-item {
                font-size: 14px;
                padding: 10px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Dashboard</h1>
    </div>
    
    <div class="dashboard-controls">
        <!-- Active pages -->
        <a href="/control" class="btn-item">
            ⚙️ Control Panel
        </a>
        
        <a href="/signals" class="btn-item">
            📊 Signal History
        </a>
        
        <!-- Future pages -->
        <div class="btn-item">
            📈 Analytics
            
        </div>
        
        <div class="btn-item">
            🎯 Strategy Manager
            
        </div>
        
        <div class="btn-item">
            💰 Portfolio
            
        </div>
        
        <div class="btn-item">
            🔔 Notifications
            
        </div>
        
        <div class="btn-item">
            ⚡ Risk Manager
            
        </div>
        
        <div class="btn-item">
            🔧 API Settings
            
        </div>
        
        <div class="btn-item">
            📱 Mobile Alerts
            
        </div>
        
        <div class="btn-item">
            🏆 Performance
            
        </div>
    </div>
</body>
</html>
