{% extends "base.html" %}

{% block title %}Control Panel - Trading Bot{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/control.css') }}">
{% endblock %}

{% block content %}

<!-- Legacy controls for compatibility -->
<div class="legacy-controls">
   <form method="post">
        <button name="action" value="start">▶️ Start</button>
        <button name="action" value="stop">⏹️ Stop</button>
        <button name="action" value="restart">🔁 Restart</button>
        <button name="action" value="logs">📄 Show Logs</button>
    </form>
</div>

{% if logs %}
<div class="logs-section">
    <h3>📄 Last 30 Log Lines</h3>
    <pre id="logs-content">{{ logs }}</pre>
</div>
{% endif %}

{% if message %}
<div class="message-section">
    <div class="message">{{ message }}</div>
</div>
{% endif %}
{% endblock %}

{% block js %}
<script src="{{ url_for('static', filename='js/control.js') }}"></script>
{% endblock %}
