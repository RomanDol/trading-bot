{% extends "base.html" %}

{% block title %}Order History - Trading Bot{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/order_history.css') }}">
{% endblock %}

{% block content %}
<div class="order-history-container">
    <h2>📊 Order History</h2>
    
    <form id="order-history-form">
        <div class="date-inputs">
            <div class="form-group">
                <label class="form-label" for="start-date">С даты:</label>
                <input type="date" id="start-date" name="start_date" class="form-input" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="end-date">По дату:</label>
                <input type="date" id="end-date" name="end_date" class="form-input" required>
            </div>
        </div>
        
        <button type="submit" class="load-button" id="load-button">
            📥 Загрузить
        </button>
    </form>
    
    <div class="message" id="message"></div>
</div>
{% endblock %}

{% block js %}
<script src="{{ url_for('static', filename='js/order_history.js') }}"></script>
{% endblock %}
