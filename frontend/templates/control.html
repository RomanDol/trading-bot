{% extends "base.html" %}

{% block title %}Control Panel - Trading Bot{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/control.css') }}">
{% endblock %}

{% block content %}

<!-- Control Buttons -->
<div class="control-buttons">
   <form method="post">
        <button name="action" value="start" class="control-btn">▶️ Start</button>
        <button name="action" value="stop" class="control-btn">⏹️ Stop</button>
        <button name="action" value="restart" class="control-btn">🔁 Restart</button>
        <button name="action" value="logs" class="control-btn">📄 Show Logs</button>
    </form>
</div>

<!-- Logs Section -->
{% if logs %}
<section class="logs-section">
    <h3>📄 Last 1000 Log Lines</h3>
    <div class="logs-container">
        <pre class="logs-content">{{ logs }}</pre>
    </div>
</section>
{% endif %}

<!-- Message Section -->
{% if message %}
<section class="message-section">
    <div class="control-message {% if 'успешно' in message.lower() or 'success' in message.lower() %}control-message--success{% elif 'ошибка' in message.lower() or 'error' in message.lower() %}control-message--error{% else %}control-message--info{% endif %}">
        {{ message }}
    </div>
</section>
{% endif %}

{% endblock %}

{% block js %}
<script src="{{ url_for('static', filename='js/control.js') }}"></script>
{% endblock %}
